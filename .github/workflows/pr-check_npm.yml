name: Check npm ci

on:
  pull_request:
    paths:
      - .github/workflows/pr-check_npm.yml
      - .npmrc
      - .nvmrc
      - package.json
      - package-lock.json
  workflow_dispatch:

# No GITHUB_TOKEN permissions are needed for dependency installation.
permissions: {}

jobs:
  npm-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, xcode-27, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
