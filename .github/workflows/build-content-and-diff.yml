name: Build Content and Diff

on:
  pull_request:
    paths:
      - "files/**"
      - "data/**"
      - ".github/workflows/build-content-and-diff.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  BUILD_BASE: ${{ github.workspace }}/build-base
  BUILD_PR: ${{ github.workspace }}/build-pr
  CONTENT: ${{ github.workspace }}/content
  DEPS_DATA_DIR: ${{ github.workspace }}/deps
  DIFF: ${{ github.workspace }}/diff.html
  STATS: ${{ github.workspace }}/diff-stats.json
  CARGO_TERM_COLOR: always

jobs:
  build-base:
    if: github.repository == 'mdn/content'
    runs-on: ubuntu-latest
    outputs:
      rari-sha: ${{ steps.rari.outputs.sha }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout content at base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: content
          persist-credentials: false

      - name: Checkout rari
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdn/rari
          ref: main
          path: rari
          persist-credentials: false

      - name: Record rari revision
        id: rari
        run: echo "sha=$(git -C rari rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build content at base
        working-directory: rari
        env:
          BUILD_OUT_ROOT: ${{ env.BUILD_BASE }}
          CONTENT_ROOT: ${{ env.CONTENT }}/files
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --locked --quiet --release build --json-issues

      - name: Upload base build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-base
          path: ${{ env.BUILD_BASE }}
          if-no-files-found: error

      - name: Upload dependency data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-data
          path: ${{ env.DEPS_DATA_DIR }}
          if-no-files-found: error

  build-pr:
    needs: build-base
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout content at PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: content
          persist-credentials: false

      - name: Checkout rari
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdn/rari
          ref: ${{ needs.build-base.outputs.rari-sha }}
          path: rari
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Download dependency data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-data
          path: ${{ env.DEPS_DATA_DIR }}

      - name: Build content at PR head
        working-directory: rari
        env:
          BUILD_OUT_ROOT: ${{ env.BUILD_PR }}
          CONTENT_ROOT: ${{ env.CONTENT }}/files
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RARI_SKIP_UPDATES: "true"
        run: cargo run --locked --quiet --release build --json-issues

      - name: Upload PR build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-pr
          path: ${{ env.BUILD_PR }}
          if-no-files-found: error

  diff:
    needs: [build-base, build-pr]
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout rari
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdn/rari
          ref: ${{ needs.build-base.outputs.rari-sha }}
          path: rari
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Download base build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-base
          path: ${{ env.BUILD_BASE }}

      - name: Download PR build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-pr
          path: ${{ env.BUILD_PR }}

      - name: Generate diff and flaw counts
        working-directory: rari
        run: |
          cargo run --locked --quiet -p diff-test diff --fast --flaws --html --value --search-index \
            --out "$DIFF" --stats-out "$STATS" "$BUILD_BASE" "$BUILD_PR"

          count_flaws() {
            find "$1" -type f -name index.json -print0 \
              | xargs -0 -r jq -r '[.doc.flaws // {} | .[] | length] | add // 0' \
              | awk '{ total += $1 } END { print total + 0 }'
          }
          BASE_FLAWS=$(count_flaws "$BUILD_BASE")
          PR_FLAWS=$(count_flaws "$BUILD_PR")
          jq --argjson base_flaws "$BASE_FLAWS" --argjson pr_flaws "$PR_FLAWS" \
            '. + {base_flaws: $base_flaws, pr_flaws: $pr_flaws}' "$STATS" > "$STATS.tmp"
          mv "$STATS.tmp" "$STATS"

      - name: Summarize diff
        run: |
          {
            echo "## Build diff"
            echo
            jq -r '"**\(.changed_files)** of \(.total_files) pages changed (\(.changes) changes); flaws: \(.base_flaws) -> \(.pr_flaws) (\(if .pr_flaws - .base_flaws > 0 then "+" else "" end)\(.pr_flaws - .base_flaws))"' "$STATS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diff report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diff-report
          path: ${{ env.DIFF }}
          if-no-files-found: error

      - name: Upload diff stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diff-stats
          path: ${{ env.STATS }}
          if-no-files-found: error
