name: Build Content and Diff

on:
  pull_request:
    paths:
      - "files/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-content-and-diff.yml"
      - ".github/workflows/pr-diff-companion.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-base:
    if: github.repository == 'mdn/content'
    runs-on: ubuntu-latest
    env:
      BUILD_OUT_ROOT: build
      CONTENT_ROOT: files
    steps:
      - name: Checkout content at base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base content
        run: npx @mdn/rari build --json-issues --data-issues
        env:
          BUILD_FLAW_LEVELS: "unsafe_html: error, *:warn"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload base build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-base
          path: ${{ env.BUILD_OUT_ROOT }}
          if-no-files-found: error

  build-pr:
    if: github.repository == 'mdn/content'
    runs-on: ubuntu-latest
    env:
      BUILD_OUT_ROOT: build
      CONTENT_ROOT: files
    steps:
      - name: Checkout content at PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PR content
        run: npx @mdn/rari build --json-issues --data-issues
        env:
          BUILD_FLAW_LEVELS: "unsafe_html: error, *:warn"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PR build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-pr
          path: ${{ env.BUILD_OUT_ROOT }}
          if-no-files-found: error

  diff:
    needs: [build-base, build-pr]
    runs-on: ubuntu-latest
    steps:
      - name: Download base build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-base
          path: build-base

      - name: Download PR build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-pr
          path: build-pr

      - name: Compare builds and flaw counts
        env:
          BASE_BUILD: build-base
          PR_BUILD: build-pr
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import path from "node:path";

          async function getPages(root) {
            const pages = new Map();
            let flaws = 0;

            async function walk(directory) {
              for (const entry of await fs.readdir(directory, { withFileTypes: true })) {
                const fullPath = path.join(directory, entry.name);
                if (entry.isDirectory()) {
                  await walk(fullPath);
                } else if (entry.name === "index.json") {
                  const relativePath = path.relative(root, fullPath);
                  const content = await fs.readFile(fullPath, "utf8");
                  const page = JSON.parse(content);
                  pages.set(relativePath, content);
                  for (const items of Object.values(page.doc?.flaws ?? {})) {
                    if (Array.isArray(items)) flaws += items.length;
                  }
                }
              }
            }

            await walk(root);
            return { pages, flaws };
          }

          const base = await getPages(process.env.BASE_BUILD);
          const pr = await getPages(process.env.PR_BUILD);
          const allPaths = [...new Set([...base.pages.keys(), ...pr.pages.keys()])];
          const changed = allPaths
            .filter((file) => base.pages.get(file) !== pr.pages.get(file))
            .sort();
          const stats = {
            changed_files: changed.length,
            total_files: allPaths.length,
            base_flaws: base.flaws,
            pr_flaws: pr.flaws,
          };

          await fs.writeFile("diff-stats.json", `${JSON.stringify(stats, null, 2)}\n`);
          const escapeHtml = (value) => value.replace(/[&<>"']/g, (char) => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
          })[char]);
          const rows = changed.map((file) => `<li><code>${escapeHtml(file)}</code></li>`).join("\n");
          await fs.writeFile("diff.html", `<!doctype html>
          <meta charset="utf-8">
          <title>Build diff</title>
          <h1>Build diff</h1>
          <p>${stats.changed_files} of ${stats.total_files} pages across both builds changed.</p>
          <p>Flaws: ${stats.base_flaws} → ${stats.pr_flaws} (${stats.pr_flaws - stats.base_flaws >= 0 ? "+" : ""}${stats.pr_flaws - stats.base_flaws}).</p>
          <ul>${rows}</ul>
          `);
          NODE

      - name: Summarize diff
        run: |
          jq -r '"## Build diff\n\n**\(.changed_files)** of \(.total_files) pages changed. Flaws: \(.base_flaws) -> \(.pr_flaws) (\(if .pr_flaws - .base_flaws > 0 then "+" else "" end)\(.pr_flaws - .base_flaws))."' diff-stats.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diff report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diff-report
          path: diff.html
          if-no-files-found: error

      - name: Upload diff stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diff-stats
          path: diff-stats.json
          if-no-files-found: error

  # Temporary preview because the workflow_run companion is not on the default branch yet.
  status-preview:
    needs: diff
    if: github.actor == 'caugner' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Download diff stats
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-diff-stats

      - name: Publish preview statuses
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number: $PR"; exit 1; }

          read -r CHANGED TOTAL BASE_FLAWS PR_FLAWS <<<"$(jq -r '
            [.changed_files, .total_files, .base_flaws, .pr_flaws]
            | map(numbers | floor) | select(length == 4) | @tsv' diff-stats.json)"
          [[ "$CHANGED" =~ ^[0-9]{1,9}$ && "$TOTAL" =~ ^[0-9]{1,9}$ && "$BASE_FLAWS" =~ ^[0-9]{1,9}$ && "$PR_FLAWS" =~ ^[0-9]{1,9}$ ]] || { echo "::error::Invalid diff-stats.json"; exit 1; }

          CURRENT_HEAD=$(gh api "/repos/$GH_REPO/pulls/$PR" \
            --jq 'select(.state == "open") | .head.sha')
          if [[ "$CURRENT_HEAD" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #$PR is closed or has a newer head; nothing to do."
            exit 0
          fi

          FLAW_DELTA=$((PR_FLAWS - BASE_FLAWS))
          FLAW_CHANGE=$(printf '%+d' "$FLAW_DELTA")
          gh api "/repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=content-build-diff \
            -f description="Pages changed: $CHANGED/$TOTAL" \
            -f target_url="https://github.com/$GH_REPO/actions/runs/$RUN_ID" > /dev/null
          gh api "/repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=content-build-flaws \
            -f description="Flaws: $PR_FLAWS ($FLAW_CHANGE)" \
            -f target_url="https://github.com/$GH_REPO/actions/runs/$RUN_ID" > /dev/null
