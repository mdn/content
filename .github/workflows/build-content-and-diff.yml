name: Build Content and Diff

on:
  pull_request:
    paths:
      - "files/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "scripts/compare-builds.mjs"
      - ".github/workflows/build-content-and-diff.yml"
      - ".github/workflows/pr-diff-companion.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-diff:
    if: github.repository == 'mdn/content'
    runs-on: ubuntu-latest
    env:
      CONTENT_ROOT: ${{ github.workspace }}/files
    steps:
      - name: Checkout content at base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js environment for base
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install base dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base content
        run: npx @mdn/rari build --json-issues --data-issues
        env:
          BUILD_OUT_ROOT: ${{ runner.temp }}/build-base
          BUILD_FLAW_LEVELS: "unsafe_html: error, *:warn"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout content at PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment for PR
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install PR dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PR content
        run: npx @mdn/rari build --json-issues --data-issues
        env:
          BUILD_OUT_ROOT: ${{ runner.temp }}/build-pr
          BUILD_FLAW_LEVELS: "unsafe_html: error, *:warn"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RARI_SKIP_UPDATES: "true"

      - name: Compare builds and flaw counts
        env:
          BASE_BUILD: ${{ runner.temp }}/build-base
          PR_BUILD: ${{ runner.temp }}/build-pr
        run: node scripts/compare-builds.mjs "$BASE_BUILD" "$PR_BUILD"

      - name: Summarize diff
        run: |
          jq -r '"## Build diff\n\n**\(.changed_files)** of \(.total_files) pages changed. Flaws: \(.base_flaws) -> \(.pr_flaws) (\(if .pr_flaws - .base_flaws > 0 then "+" else "" end)\(.pr_flaws - .base_flaws))."' diff-stats.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diff report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diff-report
          path: diff.html
          if-no-files-found: error

      - name: Upload diff stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diff-stats
          path: diff-stats.json
          if-no-files-found: error
