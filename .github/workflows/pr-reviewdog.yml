name: PR Reviewdog

on:
  workflow_run:
    workflows:
      - "PR checks"
    types:
      - in_progress

# `in_progress` can fire more than once per run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}

permissions:
  # Download artifact from lint workflow.
  actions: read
  # Post inline review comments via reviewdog.
  pull-requests: write
  # Report commit status.
  statuses: write

jobs:
  reviewdog:
    if: github.repository_owner == 'mdn'
    runs-on: ubuntu-latest
    env:
      STATUS_PATH: repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }}
      STATUS_CONTEXT: ${{ github.workflow }}
      STATUS_TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark status as pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "$STATUS_PATH" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description='Running' \
            -f target_url="$STATUS_TARGET"

      - name: Identify PR
        id: identify-pr
        env:
          BASE_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=$(gh api "repos/$HEAD_REPO/commits/$HEAD_SHA/pulls" \
            --jq "[.[] | select(.base.repo.full_name == \"$BASE_REPO\" and .head.sha == \"$HEAD_SHA\") | .number] | first // empty")
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Wait for lint results
        id: wait
        if: steps.identify-pr.outputs.number
        shell: bash
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_PATH: repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          deadline=$((SECONDS + 600))
          # The lint job usually finishes within 30 seconds of the run starting.
          sleep 30
          while ((SECONDS < deadline)); do
            workflow_run=$(gh api "$RUN_PATH")
            if jq -e --argjson attempt "$RUN_ATTEMPT" \
              '.run_attempt != $attempt or .conclusion == "cancelled"' <<< "$workflow_run" > /dev/null; then
              echo "Workflow run was cancelled or re-run."
              exit 0
            fi

            # A skipped reusable workflow is listed under the caller job id alone.
            lint_job=$(gh api "$RUN_PATH/attempts/$RUN_ATTEMPT/jobs?per_page=100" --paginate | \
              jq -scr '[.[].jobs[] | select(.name == "content / lint" or .name == "content")] | first // empty')
            if [[ -n "$lint_job" ]]; then
              lint_started_at=$(jq -r '.started_at // empty' <<< "$lint_job")
              if [[ -n "$lint_started_at" ]] && ! jq -e '.conclusion == "skipped"' <<< "$lint_job" > /dev/null; then
                # Earlier attempts can leave artifacts under the same run ID.
                artifact_id=$(gh api "$RUN_PATH/artifacts?per_page=100" --paginate | \
                  jq -sr --arg started_at "$lint_started_at" \
                    '[.[].artifacts[] | select(.name == "lint-results" and .expired == false and .created_at >= $started_at)] | first.id // empty')
                if [[ -n "$artifact_id" ]]; then
                  echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi

              if jq -e '.status == "completed"' <<< "$lint_job" > /dev/null; then
                echo "Lint job finished without an artifact."
                exit 0
              fi
            fi

            if jq -e '.status == "completed"' <<< "$workflow_run" > /dev/null; then
              echo "Workflow run finished without lint results."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Timed out waiting for lint results."
          exit 0

      - name: Download artifact
        if: steps.wait.outputs.artifact_id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.wait.outputs.artifact_id }}
          # Without this, `artifact-ids` nests the files under `lint-results/lint-results/`.
          merge-multiple: true
          path: lint-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check for artifact
        id: check
        if: steps.wait.outputs.artifact_id && hashFiles('lint-results/') != ''
        run: echo "HAS_ARTIFACT=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.check.outputs.HAS_ARTIFACT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdn-content
          ref: main
          persist-credentials: false

      - name: Setup reviewdog
        if: steps.check.outputs.HAS_ARTIFACT == 'true'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Add PR review with suggested changes using `git diff` output
        if: steps.check.outputs.HAS_ARTIFACT == 'true' && hashFiles('lint-results/lint.diff') != ''
        working-directory: mdn-content
        env:
          CI_PULL_REQUEST: ${{ steps.identify-pr.outputs.number }}
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
          CI_REPO_OWNER: ${{ github.repository_owner }}
          CI_REPO_NAME: ${{ github.event.repository.name }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          env -u GITHUB_ACTIONS reviewdog \
            -guess \
            -name="mdn-linter" \
            -f=diff \
            -f.diff.strip=1 \
            -filter-mode=diff_context \
            -reporter=github-pr-review < ../lint-results/lint.diff

      - name: Add PR review with comments for errors in markdownlint output
        if: steps.check.outputs.HAS_ARTIFACT == 'true' && hashFiles('lint-results/markdownlint.log') != ''
        working-directory: mdn-content
        env:
          CI_PULL_REQUEST: ${{ steps.identify-pr.outputs.number }}
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
          CI_REPO_OWNER: ${{ github.repository_owner }}
          CI_REPO_NAME: ${{ github.event.repository.name }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          env -u GITHUB_ACTIONS reviewdog \
            -efm="%f:%l:%c %m" \
            -efm="%f:%l %m" \
            -name="markdownlint" \
            -diff="git diff" \
            -reporter="github-pr-review" < ../lint-results/markdownlint.log

      - name: Mark status as success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "$STATUS_PATH" \
            -f state=success \
            -f context="$STATUS_CONTEXT" \
            -f description='Successful' \
            -f target_url="$STATUS_TARGET"

      - name: Mark status as failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "$STATUS_PATH" \
            -f state=failure \
            -f context="$STATUS_CONTEXT" \
            -f description='Failing' \
            -f target_url="$STATUS_TARGET"
