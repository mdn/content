<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
  <title id="title">Notification images on desktop and mobile devices</title>
  <desc id="description">Three device frames show possible notification appearances. A desktop monitor shows a notification with a portrait icon and a large landscape image. A mobile home screen shows a monochrome star badge in the status bar. A mobile banner shows the portrait icon and landscape image in an expanded notification.</desc>
  <defs>
    <symbol id="badge" viewBox="0 0 24 24">
      <path d="m12 1 3.4 7 7.6 1.1-5.5 5.4 1.3 7.5-6.8-3.6L5.2 22l1.3-7.5L1 9.1 7.6 8Z" fill="currentColor"/>
    </symbol>
    <symbol id="portrait" viewBox="0 0 56 56">
      <rect width="56" height="56" rx="12" fill="#e7dff8"/>
      <circle cx="28" cy="18" r="10" fill="#6844a3"/>
      <path d="M10 48C10 27 46 27 46 48Z" fill="#6844a3"/>
    </symbol>
    <symbol id="landscape" viewBox="0 0 434 190" preserveAspectRatio="none">
      <rect width="434" height="190" fill="#dceff8"/>
      <circle cx="352" cy="40" r="22" fill="#efb535"/>
      <path d="M0 190 116 32 260 190Z" fill="#417b72"/>
      <path d="m88 70 28-38 35 38-22-7-13 13-12-13Z" fill="#fff"/>
      <path d="M162 190 298 65 434 190Z" fill="#659d85"/>
      <path d="M0 164Q110 120 222 167T434 150V190H0Z" fill="#305d52"/>
    </symbol>
    <symbol id="app" viewBox="0 0 44 44">
      <rect width="44" height="44" rx="12" fill="#fff" fill-opacity="0.85"/>
      <rect x="12" y="12" width="20" height="20" rx="6" fill="#7b91ad"/>
    </symbol>
  </defs>
  <rect width="1200" height="610" fill="#f4f6f8"/>
  <g font-family="Arial, sans-serif" fill="#182230">
    <g font-size="20" font-weight="bold" text-anchor="middle">
      <text x="260" y="38">Desktop</text>
      <text x="690" y="38">Mobile home screen</text>
      <text x="1030" y="38">Mobile banner</text>
    </g>

    <!-- Desktop monitor and notification. -->
    <rect x="20" y="75" width="480" height="325" rx="14" fill="#263445"/>
    <rect x="32" y="87" width="456" height="284" rx="4" fill="#dbe5ef"/>
    <path d="M32 285Q220 100 488 210V371H32Z" fill="#bfcedf"/>
    <rect x="32" y="347" width="456" height="24" fill="#a8b9cd"/>
    <circle cx="246" cy="359" r="6" fill="#fff"/>
    <circle cx="268" cy="359" r="6" fill="#fff"/>
    <path d="M232 400H288L299 444H221Z" fill="#526172"/>
    <rect x="187" y="444" width="146" height="10" rx="5" fill="#263445"/>
    <rect x="174" y="154" width="302" height="185" rx="10" fill="#fff" stroke="#a8b3c2"/>
    <text x="187" y="175" font-size="11" fill="#526172">Photo app · now</text>
    <use href="#portrait" x="187" y="187" width="38" height="38"/>
    <text x="235" y="199" font-size="14" font-weight="bold">New photo from Alex</text>
    <text x="235" y="216" font-size="11">Alex shared a photo from</text>
    <text x="235" y="230" font-size="11">today's hike.</text>
    <use href="#landscape" x="187" y="240" width="276" height="88" preserveAspectRatio="none"/>
    <g fill="none" stroke="#526172" stroke-width="1.5">
      <path d="M187 206H157V492H194"/>
      <path d="M463 284H514V492H398"/>
    </g>
    <g font-family="monospace" font-size="17" font-weight="bold">
      <text x="204" y="498">icon</text>
      <text x="338" y="498">image</text>
    </g>

    <!-- Mobile home screen with a notification badge in the status bar. -->
    <rect x="555" y="75" width="270" height="470" rx="34" fill="#263445"/>
    <rect x="564" y="84" width="252" height="452" rx="26" fill="#dbe5ef"/>
    <path d="M564 292Q680 184 816 320V510Q816 536 790 536H590Q564 536 564 510Z" fill="#bfcedf"/>
    <rect x="651" y="90" width="78" height="15" rx="8" fill="#263445"/>
    <text x="580" y="110" font-size="12">9:41</text>
    <use href="#badge" x="617" y="96" width="17" height="17" color="#263445"/>
    <rect x="780" y="99" width="20" height="10" rx="2" fill="#263445"/>
    <path d="M625 119V161" fill="none" stroke="#526172" stroke-width="1.5"/>
    <text x="601" y="184" font-family="monospace" font-size="17" font-weight="bold">badge</text>
    <g>
      <use href="#app" x="585" y="330" width="44" height="44"/>
      <use href="#app" x="668" y="330" width="44" height="44"/>
      <use href="#app" x="751" y="330" width="44" height="44"/>
      <use href="#app" x="585" y="399" width="44" height="44"/>
      <use href="#app" x="668" y="399" width="44" height="44"/>
      <rect x="751" y="399" width="44" height="44" rx="12" fill="#6844a3"/>
      <use href="#badge" x="762" y="410" width="22" height="22" color="#fff"/>
    </g>
    <text x="773" y="461" font-size="11" text-anchor="middle">Photo app</text>
    <rect x="592" y="480" width="196" height="32" rx="16" fill="#fff" fill-opacity="0.6"/>
    <rect x="655" y="523" width="70" height="4" rx="2" fill="#263445"/>

    <!-- Mobile device with an expanded notification banner. -->
    <rect x="895" y="75" width="270" height="470" rx="34" fill="#263445"/>
    <rect x="904" y="84" width="252" height="452" rx="26" fill="#dbe5ef"/>
    <rect x="991" y="90" width="78" height="15" rx="8" fill="#263445"/>
    <text x="920" y="110" font-size="12">9:41</text>
    <rect x="1120" y="99" width="20" height="10" rx="2" fill="#263445"/>
    <rect x="919" y="359" width="222" height="133" rx="12" fill="#bfcedf"/>
    <rect x="933" y="375" width="114" height="9" rx="4" fill="#94a9c2"/>
    <rect x="933" y="396" width="186" height="6" rx="3" fill="#a8b9cd"/>
    <rect x="933" y="412" width="156" height="6" rx="3" fill="#a8b9cd"/>
    <rect x="913" y="124" width="234" height="206" rx="14" fill="#fff" stroke="#a8b3c2"/>
    <text x="925" y="145" font-size="11" fill="#526172">Photo app · now</text>
    <text x="925" y="170" font-size="13" font-weight="bold">New photo from Alex</text>
    <text x="925" y="190" font-size="11">Alex shared a photo from</text>
    <text x="925" y="205" font-size="11">today's hike.</text>
    <use href="#portrait" x="1101" y="157" width="34" height="34"/>
    <use href="#landscape" x="925" y="222" width="210" height="96" preserveAspectRatio="none"/>
    <rect x="995" y="523" width="70" height="4" rx="2" fill="#263445"/>
    <g fill="none" stroke="#526172" stroke-width="1.5">
      <path d="M1135 174H1178V566H1082"/>
      <path d="M925 270H879V566H958"/>
    </g>
    <g font-family="monospace" font-size="17" font-weight="bold">
      <text x="1040" y="572">icon</text>
      <text x="966" y="572">image</text>
    </g>
  </g>
</svg>
