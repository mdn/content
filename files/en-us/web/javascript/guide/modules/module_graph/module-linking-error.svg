<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 326" role="img" aria-labelledby="title description">
  <title id="title">A missing export causes linking to fail</title>
  <desc id="description">All four modules have loaded successfully. config.js and logger.js are linked. formatters.js has created its config and log import bindings, but resolving missing fails because logger.js does not export it. The red cross marks the failed resolution. formatters.js and main.js transition from linking back to unlinked as the error propagates. Dashed arrows show the bindings created before the error; solid arrows show module dependencies. No module bodies are evaluated.</desc>
  <style>
    text { fill: #6b7280; font-family: Menlo, Consolas, monospace; font-size: 12px; }
    .identifier { fill: #08827e; font-weight: bold; }
    .outline { fill: none; stroke: #808080; stroke-width: 1; }
    .linked { stroke: #08827e; }
    .linking { stroke: #a66b00; }
    .status { text-anchor: end; paint-order: stroke; stroke: white; stroke-width: 4; stroke-linejoin: round; }
    .linked-label { fill: #08827e; }
    .linking-label { fill: #895900; }
    .failed-label { fill: #b32930; }
    .edge { fill: none; stroke: #808080; stroke-width: 1; marker-end: url(#arrow); }
    .binding { fill: none; stroke: #808080; stroke-width: 1; stroke-dasharray: 4 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#808080"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="330" height="88" fill="#fff8e6"/>
  <rect x="390" y="30" width="500" height="116" fill="#fff8e6"/>
  <rect x="20" y="186" width="280" height="70" fill="#edf8f5"/>
  <rect x="560" y="186" width="270" height="80" fill="#edf8f5"/>

  <path class="edge" d="M 340 48 H 390"/>
  <path class="edge" d="M 265 76 V 186"/>
  <path class="edge" d="M 544 58 L 300 186"/>
  <path class="edge" d="M 689 76 V 186"/>

  <path class="binding" d="M 458 58 L 124 198"/>
  <path class="binding" d="M 480 76 V 176 H 700 V 198"/>

  <path class="outline linking" d="M 92 30 H 350 V 118 H 20 V 30 H 28"/>
  <text x="34" y="34">main.js</text>
  <text x="34" y="52">import { <tspan class="identifier">greet</tspan> } from "./formatters.js";</text>
  <text x="34" y="70">import <tspan class="identifier">config</tspan> from "./config.js";</text>
  <text x="34" y="106"><tspan class="identifier">greet</tspan>("Josh", <tspan class="identifier">config</tspan>.locale);</text>

  <path class="outline linking" d="M 504 30 H 890 V 146 H 390 V 30 H 398"/>
  <text x="404" y="34">formatters.js</text>
  <text x="404" y="52">import <tspan class="identifier">config</tspan> from "./config.js";</text>
  <text x="404" y="70">import { <tspan class="identifier">log</tspan>, <tspan class="identifier failed-label">missing</tspan> } from "./logger.js";</text>
  <text x="404" y="98">export function <tspan class="identifier">greet</tspan>(name, localeName = <tspan class="identifier">config</tspan>.defaultLocale) {</text>
  <text x="404" y="116" xml:space="preserve">  // ...</text>
  <text x="404" y="134">}</text>

  <path class="outline linked" d="M 106 186 H 300 V 256 H 20 V 186 H 28"/>
  <text x="34" y="190">config.js</text>
  <text x="34" y="208">export <tspan class="identifier">default</tspan> {</text>
  <text x="34" y="226" xml:space="preserve">  // ...</text>
  <text x="34" y="244">};</text>

  <path class="outline linked" d="M 646 186 H 830 V 266 H 560 V 186 H 568"/>
  <text x="574" y="190">logger.js</text>
  <text x="574" y="208">export function <tspan class="identifier">log</tspan>(message) {</text>
  <text x="574" y="226" xml:space="preserve">  // ...</text>
  <text x="574" y="244">}</text>

  <path class="binding" d="M 540 76 V 154"/>
  <path d="M 534 160 L 546 172 M 546 160 L 534 172" fill="none" stroke="#c23b40" stroke-width="2" stroke-linecap="round"/>
  <text class="failed-label" x="554" y="170">Failed</text>

  <text class="status linking-label" x="350" y="22">Linking → Unlinked</text>
  <text class="status linking-label" x="890" y="22">Linking → Unlinked</text>
  <text class="status linked-label" x="300" y="178">Linked</text>
  <text class="status linked-label" x="830" y="178">Linked</text>

  <g aria-label="Legend">
    <path class="edge" d="M 20 302 H 60"/>
    <text x="72" y="306">Module dependency</text>
    <path class="binding" d="M 300 302 H 340"/>
    <text x="352" y="306">Binding connection</text>
  </g>
</svg>
