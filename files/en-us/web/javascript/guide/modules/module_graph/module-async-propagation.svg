<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 515" role="img" aria-labelledby="title description">
  <title id="title">Top-level await affects transitive importers</title>
  <desc id="description">App imports Router, Dashboard, Editor, and Help. Router imports Auth and Routes; Dashboard imports Auth, Reports, and Charts; Editor imports Documents and Toolbar; Help imports Markdown. Auth imports Config and Tokens; Reports imports Database and Format; Documents imports Database and Markdown; Charts imports Format; Toolbar imports Icons; Markdown and Routes import Format. Config imports Parse; Database imports Parse and Codec; Tokens imports Codec. Config and Database contain top-level await, shown in dark teal. Their transitive importers App, Router, Dashboard, Editor, Auth, Reports, and Documents are light teal. The remaining modules have synchronous dependency subgraphs and are gray.</desc>
  <style>
    text { fill: #6b7280; font-family: Menlo, Consolas, monospace; font-size: 14px; }
    .node { fill: #f5f5f5; stroke: #808080; }
    .dependent { fill: #e0f2ef; stroke: #08827e; }
    .async { fill: #08827e; stroke: #08827e; }
    .edge { fill: none; stroke: #808080; marker-end: url(#arrow); }
    .label { text-anchor: middle; dominant-baseline: middle; }
    .async-label { fill: white; font-weight: bold; }
    .legend { font-size: 13px; }
  </style>
